<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Compliance review tier distribution</title>
<desc id="desc">Provider-month counts by review tier: routine 2315, watch 2696, high 661, critical 328.</desc>
<rect width="960" height="520" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Compliance monitoring review tiers</text>
<text x="60" y="88" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">6,000 synthetic provider-months • transparent rule-based monitoring</text>
<text x="60" y="165" font-family="Arial, sans-serif" font-size="18" fill="#111827">Routine</text>
<rect x="180" y="140" width="324" height="34" rx="5" fill="#94a3b8"/>
<text x="520" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">2,315</text>
<text x="60" y="245" font-family="Arial, sans-serif" font-size="18" fill="#111827">Watch</text>
<rect x="180" y="220" width="377" height="34" rx="5" fill="#f59e0b"/>
<text x="573" y="245" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">2,696</text>
<text x="60" y="325" font-family="Arial, sans-serif" font-size="18" fill="#111827">High</text>
<rect x="180" y="300" width="93" height="34" rx="5" fill="#f97316"/>
<text x="289" y="325" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">661</text>
<text x="60" y="405" font-family="Arial, sans-serif" font-size="18" fill="#111827">Critical</text>
<rect x="180" y="380" width="46" height="34" rx="5" fill="#dc2626"/>
<text x="242" y="405" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">328</text>
<text x="60" y="474" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Critical = material finding or multiple high-priority controls; model scores are not used to assign these deterministic tiers.</text>
</svg>