<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Review capacity and future finding capture</title>
<desc id="desc">Top 5 percent of risk captures 19.2 percent of future findings, top 10 percent captures 30.3 percent, top 20 percent captures 43.6 percent.</desc>
<rect width="960" height="520" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Review capacity vs. future-finding capture</text>
<text x="60" y="88" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Preferred model • pooled out-of-time predictions</text>
<line x1="120" y1="430" x2="880" y2="430" stroke="#d1d5db"/>
<line x1="120" y1="140" x2="120" y2="430" stroke="#d1d5db"/>
<text x="72" y="435" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">0%</text>
<text x="66" y="290" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">25%</text>
<text x="66" y="145" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">50%</text>
<line x1="120" y1="285" x2="880" y2="285" stroke="#e5e7eb" stroke-dasharray="5 5"/>
<line x1="120" y1="140" x2="880" y2="140" stroke="#e5e7eb" stroke-dasharray="5 5"/>
<rect x="180" y="319" width="150" height="111" rx="6" fill="#93c5fd"/>
<text x="205" y="308" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">19.2%</text>
<text x="215" y="467" font-family="Arial, sans-serif" font-size="16" fill="#374151">Top 5%</text>
<rect x="405" y="254" width="150" height="176" rx="6" fill="#60a5fa"/>
<text x="430" y="243" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">30.3%</text>
<text x="432" y="467" font-family="Arial, sans-serif" font-size="16" fill="#374151">Top 10%</text>
<rect x="630" y="177" width="150" height="253" rx="6" fill="#2563eb"/>
<text x="655" y="166" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">43.6%</text>
<text x="658" y="467" font-family="Arial, sans-serif" font-size="16" fill="#374151">Top 20%</text>
<text x="60" y="500" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">Top-decile precision = 41.0%; lift = 3.03× over the 13.5% pooled future-finding prevalence.</text>
</svg>