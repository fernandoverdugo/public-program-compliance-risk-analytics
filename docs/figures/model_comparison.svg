<text x="715" y="279" font-family="Arial, sans-serif" font-size="16" fill="#111827">0.654</text>
<rect x="700" y="293" width="98" height="26" rx="4" fill="#94a3b8"/>
<text x="808" y="314" font-family="Arial, sans-serif" font-size="16" fill="#111827">0.234 AP</text>
<text x="60" y="365" font-family="Arial, sans-serif" font-size="17" fill="#374151">Initial full logistic</text>
