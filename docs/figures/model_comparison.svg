<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Compliance risk model comparison</title>
<desc id="desc">Comparison of ROC-AUC and average precision across prevalence, deterministic rules, full logistic regression, and preferred ten-feature logistic regression.</desc>
<rect width="960" height="560" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Temporal risk-model comparison</text>
<text x="60" y="88" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">Mean across four expanding time folds with a three-month embargo</text>
<text x="60" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">Model</text>
<text x="430" y="145" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">ROC-AUC</text>
