<text x="60" y="205" font-family="Arial, sans-serif" font-size="17" fill="#374151">Prevalence only</text>
<rect x="430" y="183" width="210" height="26" rx="4" fill="#cbd5e1"/>
<text x="650" y="204" font-family="Arial, sans-serif" font-size="16" fill="#111827">0.500</text>
