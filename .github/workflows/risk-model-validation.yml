name: risk-model-validation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/generate_synthetic_data.py"
      - "src/model_features.py"
      - "src/validate_risk_models.py"
      - "src/model_diagnostics.py"
      - "tests/test_risk_modeling.py"
      - "tests/test_model_diagnostics.py"
      - "requirements.txt"
      - ".github/workflows/risk-model-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - run: python -m pytest -q tests/test_risk_modeling.py tests/test_model_diagnostics.py

      - run: python src/generate_synthetic_data.py

      - run: python src/validate_risk_models.py

      - run: python src/model_diagnostics.py

      - name: Validate model artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("data/metadata/risk_model_validation.json").read_text()
          )

          assert result["validation"]["fold_count"] == 4
          assert result["validation"]["embargo_months"] == 3

          expected = {
              "prevalence_only",
              "rule_benchmark",
              "logistic_regression",
              "hist_gradient_boosting",
          }
          assert set(result["aggregate"]) == expected

          for model in expected:
              roc = result["aggregate"][model]["roc_auc"]["mean"]
              ap = result["aggregate"][model]["average_precision"]["mean"]
              assert 0 <= roc <= 1
              assert 0 <= ap <= 1

          diagnostics = json.loads(
              Path("data/metadata/model_diagnostics.json").read_text()
          )
          assert diagnostics["out_of_time_rows"] == 3000
          assert len(diagnostics["pooled_capacity"]) == 3
          assert len(diagnostics["calibration"]["bins"]) >= 5
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: compliance-risk-model-validation
          path: |
            data/metadata/risk_model_validation.json
            data/metadata/model_diagnostics.json
